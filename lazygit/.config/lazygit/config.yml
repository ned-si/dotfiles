gui:
  nerdFontsVersion: "3"
  showFileTree: true
  # Catppuccin Mocha, to match tmux, ghostty and nvim.
  theme:
    activeBorderColor:
      - '#b4befe'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#b4befe'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
  authorColors:
    '*': '#b4befe'

git:
  # Reuse the delta setup from ~/.gitconfig. --paging=never is required or delta
  # tries to launch its own pager inside lazygit's.
  paging:
    colorArg: always
    pager: delta --dark --paging=never
  # Only relevant on repos that use it, harmless elsewhere.
  autoFetch: true

os:
  edit: 'nvim {{filename}}'
  editAtLine: 'nvim +{{line}} {{filename}}'

customCommands:
  # GitHub only, so this is for personal repos. Work is on Bitbucket, where
  # PRs go through atlas.nvim or the browser instead.
  - key: 'O'
    command: 'nvim -c ":Octo pr create"'
    context: 'localBranches'
    loadingText: 'opening Octo'
    description: 'Create pull request with Octo (GitHub only)'
    subprocess: true
