version: '3'

# Config is managed with GNU stow. Every top-level directory here is a stow
# "package" whose interior mirrors $HOME, so `stow zsh` turns zsh/.zshrc into
# ~/.zshrc as a symlink back into this repo.
#
# Which packages get stowed depends on the machine, which is why this used to
# live on separate git branches. Branches were the wrong tool: they had to be
# rebased forever and shared changes landed twice. Package selection is a
# deployment concern, so it belongs here.

vars:
  # Stowed on every machine.
  COMMON: zsh tmux nvim git ssh lazygit gh-dash ghostty markdownlint bin
  # Stowed only on the Arch/X11 desktop.
  LINUX: linux-x11 i3 i3-layout-manager polybar picom rofi autorandr
  # Never stowed automatically. See the note in the Brewfile.
  MACOS_WM: macos-wm

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  check:all:
    desc: Run every check, the same ones CI runs
    cmds:
      - task: check:shell
      - task: check:lua
      - task: check:markdown
      - task: check:tmux
      - task: check:nvim
      - task: check:stow
      - task: check:ghostty
      - task: check:path

  check:shell:
    desc: zsh/bash syntax, shellcheck, and exercise the listing aliases
    cmds:
      - bash ci/check-shell.sh

  check:lua:
    desc: stylua formatting check
    cmds:
      - |
        if command -v stylua >/dev/null 2>&1; then
          stylua --check nvim/.config/nvim
        else
          echo "  SKIP     stylua not installed"
        fi

  check:markdown:
    desc: markdownlint the repo's own docs
    # Same global config nvim-lint uses, so a doc that is clean in the editor is
    # clean here. MD013 is on at 80 columns deliberately: a table too wide to fit
    # is a prompt to rewrite it as a list.
    cmds:
      - |
        cfg="$HOME/.config/markdownlint/config.yaml"
        [ -f "$cfg" ] || cfg="markdownlint/.config/markdownlint/config.yaml"
        if command -v markdownlint-cli2 >/dev/null 2>&1; then
          markdownlint-cli2 --config "$cfg" README.md 'docs/**/*.md'
        else
          echo "  SKIP     markdownlint-cli2 not installed"
        fi

  check:tmux:
    desc: tmux config loads, and the bindings are the intended ones
    cmds:
      - bash ci/check-tmux.sh

  check:nvim:
    desc: nvim starts clean, with the expected options, mappings and filetypes
    cmds:
      - bash ci/check-nvim.sh

  check:stow:
    desc: every package links cleanly into an empty target
    cmds:
      - bash ci/check-stow.sh

  check:ghostty:
    desc: "ghostty config validates (macOS only, skips elsewhere)"
    cmds:
      - bash ci/check-ghostty.sh

  check:path:
    desc: "user bin dirs beat the system ones (macOS only, skips elsewhere)"
    cmds:
      - bash ci/check-path.sh

  fmt:
    desc: Format the lua config in place
    cmds:
      - stylua nvim/.config/nvim

  brew:
    desc: Install the Homebrew toolchain
    cmds:
      - brew bundle install --file=Brewfile

  brew:tex:
    desc: "Install TeX and the PDF viewer for vimtex"
    cmds:
      # The basictex cask runs a pkg installer, so this one step may ask for a
      # password on a machine that has not installed it yet.
      - brew install --cask skim basictex
      - task: tex:latexmk

  tex:latexmk:
    desc: "Install latexmk without needing root"
    cmds:
      # BasicTeX ships a minimal tree and does not include latexmk, which vimtex
      # needs to drive compilation.
      #
      # The obvious route, `tlmgr install latexmk`, needs root: the tree under
      # /usr/local/texlive is root-owned. That is not available on a machine
      # where policy has removed %admin from /etc/sudoers, which is the case on
      # the work laptop, so being in the admin group does not help. tlmgr's user
      # mode is not an option either, because latexmk is marked non-relocatable
      # and tlmgr refuses to install it into TEXMFHOME.
      #
      # latexmk is a self-contained perl script, so fetching it straight from
      # CTAN into ~/.local/bin sidesteps all of that. macOS ships perl.
      #
      # On a machine where sudo does work, this is equivalent:
      #   sudo /Library/TeX/texbin/tlmgr install latexmk
      - |
        set -eu
        mkdir -p "$HOME/.local/bin"
        tmp=$(mktemp)
        curl -fsSL --max-time 120 -o "$tmp" \
          https://mirrors.ctan.org/support/latexmk/latexmk.pl
        install -m 0755 "$tmp" "$HOME/.local/bin/latexmk"
        rm -f "$tmp"
        "$HOME/.local/bin/latexmk" --version

  update:
    desc: Update everything, then show what changed
    # Nothing in this repo carries a hand-maintained version. The Brewfile has no
    # version constraints, tpm tracks branches, and the two `version = "*"` nvim
    # specs resolve to the latest tag. Each tool owns its own state, so this just
    # drives all four rather than trying to be a package manager.
    #
    # Renovate would have nothing to do here: its homebrew manager reads tap
    # Formula/*.rb files, not Brewfiles.
    #
    # lazy-lock.json is the one file that records versions, so `git diff` after
    # this is the closest thing to a dependency changelog. Review it before
    # committing.
    cmds:
      - brew update
      - brew upgrade
      # Installs anything added to the Brewfile since last time.
      - brew bundle install --file=Brewfile
      # Updates plugins and rewrites lazy-lock.json.
      - nvim --headless "+Lazy! sync" +qa
      # Refreshes the mason registry. Upgrading individual tools is the `:Mason`
      # UI, since mason has no headless upgrade-all.
      - nvim --headless -c 'Lazy! load mason.nvim' -c 'MasonUpdate' -c 'qa' || true
      - task: tmux:update
      # latexmk is fetched from CTAN rather than managed by tlmgr, so refresh it.
      - task: tex:latexmk
      - cmd: git --no-pager diff --stat
        ignore_error: true

  tmux:update:
    desc: Update the tmux plugins
    cmds:
      - |
        set -eu
        tpm="$HOME/.tmux/plugins/tpm"
        if [ ! -d "$tpm" ]; then
          echo "tpm is not installed; run 'task tmux:plugins' first" >&2
          exit 1
        fi
        git -C "$tpm" pull --ff-only
        # Same as install: tpm needs a live server to read
        # TMUX_PLUGIN_MANAGER_PATH, and a server only stays up once it owns a
        # session.
        tmux new-session -d -s tpm-update
        tmux source-file "$HOME/.tmux.conf"
        "$tpm/bin/update_plugins" all
        tmux kill-session -t tpm-update

  link:
    desc: Symlink this platform's config into $HOME
    cmds:
      - task: _stow
        vars: { STOW_ARGS: --restow }

  unlink:
    desc: Remove the symlinks this platform's config created
    cmds:
      - task: _stow
        vars: { STOW_ARGS: --delete }

  link:check:
    desc: Dry-run the linking and show what would change
    cmds:
      - task: _stow
        vars: { STOW_ARGS: "--simulate --verbose=2" }

  adopt:
    desc: >-
      Take over config files that already exist in $HOME. This OVERWRITES the
      repo's copies with whatever is in $HOME, so run it on a clean tree and
      inspect `git diff` afterwards.
    cmds:
      - task: _stow
        vars: { STOW_ARGS: --adopt }
      - git diff --stat

  tmux:plugins:
    desc: "Install tpm and the tmux plugins (run after `task link`)"
    cmds:
      - |
        set -eu
        tpm="$HOME/.tmux/plugins/tpm"
        if [ ! -d "$tpm" ]; then
          git clone --depth 1 https://github.com/tmux-plugins/tpm "$tpm"
        else
          git -C "$tpm" pull --ff-only
        fi
        if [ ! -e "$HOME/.tmux.conf" ]; then
          echo "~/.tmux.conf is not linked yet; run 'task link' first." >&2
          exit 1
        fi
        # tpm reads TMUX_PLUGIN_MANAGER_PATH out of a running server, and a
        # server only stays up once it owns a session, so make a throwaway one.
        tmux new-session -d -s tpm-install
        tmux source-file "$HOME/.tmux.conf"
        "$tpm/bin/install_plugins"
        tmux kill-session -t tpm-install

  link:macos-wm:
    desc: "Opt in to the yabai/skhd/spacebar config (needs SIP changes)"
    cmds:
      - task: _stow
        vars: { STOW_ARGS: --restow, PKGS: '{{.MACOS_WM}}' }

  # Resolves the package list for the current OS unless PKGS is passed in,
  # then shells out to stow once.
  _stow:
    internal: true
    requires:
      vars: [STOW_ARGS]
    cmds:
      - |
        set -eu
        pkgs="{{.PKGS}}"
        if [ -z "$pkgs" ]; then
          case "$(uname -s)" in
            Darwin) pkgs="{{.COMMON}}" ;;
            Linux)  pkgs="{{.COMMON}} {{.LINUX}}" ;;
            *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
          esac
        fi
        echo "stow {{.STOW_ARGS}} -> $pkgs"
        stow --dir="$PWD" --target="$HOME" {{.STOW_ARGS}} $pkgs
