# Prefix on C-f rather than C-b.
unbind C-b
set-option -g prefix C-f
bind C-f send-prefix

set-option -g default-shell /bin/zsh

# --- terminal -------------------------------------------------------------
set -g default-terminal "tmux-256color"
# Truecolour and undercurl, so nvim diagnostics render as intended.
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",*:RGB"
set -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set -ga terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%{255}%&%d::%p3%{255}%&%d%;m"

# Required for yazi's image previews: tmux otherwise swallows the Kitty
# graphics escape sequences that Ghostty understands.
set -g allow-passthrough on

# Let nvim see focus changes so 'autoread' works.
set -g focus-events on

set -sg escape-time 0
set-option -g history-limit 50000
set -g mouse on
set-window-option -g automatic-rename off
set -g renumber-windows on
# Don't kill the client when the last session is destroyed.
set -g detach-on-destroy off

# --- panes and windows ----------------------------------------------------
bind -n M-v split-window -v -c "#{pane_current_path}"
bind -n M-h split-window -h -c "#{pane_current_path}"

bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-S-j resize-pane -D 5
bind -n M-S-k resize-pane -U 5
bind -n M-S-h resize-pane -L 5
bind -n M-S-l resize-pane -R 5

bind -n M-n next-window
bind -n M-p previous-window
bind -n M-c new-window -c "#{pane_current_path}"

# Send input to every pane at once.
bind -n M-s setw synchronize-panes

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- copy mode ------------------------------------------------------------
setw -g mode-keys vi
set -g status-keys vi
setw -g monitor-activity on

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

# --- sessionizer ----------------------------------------------------------
bind -r d run-shell "~/.local/bin/tmux-sessionizer ~/repos/dotfiles"
bind -r n run-shell "~/.local/bin/tmux-sessionizer ~/braindump"
bind -r f run-shell "~/.local/bin/tmux-sessionizer"

# TODO.md of the current project, falling back to the notes vault.
bind -r t neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/braindump/notes/personal/TODO.md"

# --- plugins --------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'

# prefix + tab to fuzzy-grab paths, URLs and words off the pane.
# Replaces tmux-thumbs, which is a Rust binary needing a cargo build; extrakto
# is python3 + fzf, both of which are already here.
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'tab'
set -g @extrakto_clip_tool 'pbcopy'
set -g @extrakto_clip_tool_run 'tmux_osc52'

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"

# Keep this at the very bottom.
run '~/.tmux/plugins/tpm/tpm'
