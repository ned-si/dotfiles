# Global markdownlint defaults.
#
# markdownlint-cli2 has no XDG config location: it only searches the linted
# file's directory and its ancestors. nvim-lint passes this file with --config so
# that loose files get sensible defaults.
#
# This does not merge with a project-local .markdownlint.yaml. If a project has
# its own config, that config wins and these settings do not apply there.

# Bare URLs. Wrapping every link in angle brackets is noise in notes and commit
# messages, and most renderers autolink anyway.
MD034: false

# "Descriptive link text": objects to "click here", "here", "link" and similar.
# Reasonable for published docs, tedious for personal notes.
MD059: false

# Line length. Kept on deliberately: 80 matches the editor's textwidth, and being
# told when a line runs over is the point. A table too wide to fit is a signal to
# rewrite it as a list.
#
# Code blocks are exempt. A shell command or a long URL cannot be wrapped without
# changing what it means, so flagging those is noise rather than a prompt to fix
# anything. Set code_blocks to true to be told anyway.
MD013:
  line_length: 80
  heading_line_length: 80
  code_blocks: false
  tables: true
  headings: true
